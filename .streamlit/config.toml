[global]
# Disable development mode to remove "Clear caches" and other dev options
developmentMode = false

[theme]
# Corporate Clean — 企业简洁风，专业可信的实验室管理系统视觉
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
font = "sans serif"

[client]
# Hide the developer toolbar to suppress "Clear caches" prompts
toolbarMode = "viewer"

[server]
# Auto-rerun when source files change (no "Source file changed" prompt)
runOnSave = true
enableXsrfProtection = true
