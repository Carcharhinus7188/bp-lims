<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <style>
    :root{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:#0F172A}
    *{box-sizing:border-box}
    body{margin:0;background:transparent}
    .camera-card{border:1px solid #E2E8F0;border-radius:14px;background:#FFFFFF;padding:12px;box-shadow:0 1px 3px rgba(15,23,42,.04)}
    .top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
    .label{font-size:15px;font-weight:600;line-height:1.35;color:#0F172A}
    .lens{font-size:12px;color:#475569;background:#F1F5F9;border-radius:999px;padding:5px 9px;white-space:nowrap}
    .stage{position:relative;width:100%;aspect-ratio:4/3;overflow:hidden;border-radius:11px;background:#1E293B}
    video,img{display:block;width:100%;height:100%;object-fit:contain;background:#0F172A}
    .message{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#E2E8F0;padding:24px;line-height:1.55}
    .actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:10px}
    button,.native-label{appearance:none;border:1px solid #CBD5E1;border-radius:10px;background:#FFFFFF;color:#334155;
      min-height:42px;padding:8px 10px;font-size:14px;font-weight:600;text-align:center;display:flex;align-items:center;justify-content:center;
      transition:all .2s ease}
    button:hover{background:#F8FAFC;border-color:#94A3B8}
    button:active{transform:scale(.98)}
    button.primary{background:#2563EB;border-color:#2563EB;color:#fff}
    button.primary:hover{background:#1D4ED8;border-color:#1D4ED8}
    button:disabled{opacity:.45}
    .native-label{grid-column:1/-1;background:#F1F5F9}
    input[type=file]{display:none}
    .hint{font-size:12px;color:#64748B;line-height:1.45;margin:9px 2px 0}
    @media(max-width:560px){.actions{grid-template-columns:1fr}.native-label{grid-column:auto}.top{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
  <section class="camera-card">
    <div class="top">
      <div id="label" class="label">现场拍摄</div>
      <div id="lens" class="lens">默认：后置摄像头</div>
    </div>
    <div class="stage">
      <video id="video" autoplay muted playsinline></video>
      <img id="preview" alt="已拍摄照片" hidden>
      <div id="message" class="message">正在启动后置摄像头…</div>
    </div>
    <div class="actions">
      <button id="start">启动摄像头</button>
      <button id="switch">切换为前置摄像头</button>
      <button id="capture" class="primary" disabled>拍照</button>
      <button id="retake" hidden>重新拍摄</button>
      <label class="native-label" for="nativeCamera">无法切换时：调用系统相机（后置优先）</label>
      <input id="nativeCamera" type="file" accept="image/*" capture="environment">
    </div>
    <div class="hint">Mac/笔记本通常仅有前置摄像头，系统将自动检测并切换。首次使用请允许浏览器访问摄像头；系统相机入口用于兼容限制实时切换的浏览器。</div>
  </section>
  <canvas id="canvas" hidden></canvas>
  <script>
    const Streamlit={
      ready(){
        window.parent.postMessage({isStreamlitMessage:true,type:"streamlit:componentReady",apiVersion:1},"*");
      },
      height(){
        window.parent.postMessage({isStreamlitMessage:true,type:"streamlit:setFrameHeight",height:document.documentElement.scrollHeight},"*");
      },
      value(value){
        window.parent.postMessage({isStreamlitMessage:true,type:"streamlit:setComponentValue",value},"*");
      }
    };

    const video=document.getElementById("video");
    const preview=document.getElementById("preview");
    const message=document.getElementById("message");
    const lens=document.getElementById("lens");
    const startButton=document.getElementById("start");
    const switchButton=document.getElementById("switch");
    const captureButton=document.getElementById("capture");
    const retakeButton=document.getElementById("retake");
    const nativeCamera=document.getElementById("nativeCamera");
    const canvas=document.getElementById("canvas");
    let stream=null;
    let facingMode="environment";
    let rendered=false;
    let hasRearCamera=true;

    function stopStream(){
      if(stream){stream.getTracks().forEach(track=>track.stop());stream=null}
      video.srcObject=null;
    }

    function updateLens(){
      const rear=facingMode==="environment";
      lens.textContent=rear?"当前：后置摄像头":"当前：前置摄像头";
      startButton.textContent=rear?"启动后置摄像头":"启动前置摄像头";
      switchButton.textContent=rear?"切换为前置摄像头":"切换为后置摄像头";
      nativeCamera.setAttribute("capture",facingMode);
    }

    async function detectCameras(){
      try{
        var devices=await navigator.mediaDevices.enumerateDevices();
        var videoDevices=devices.filter(function(d){return d.kind==="videoinput"});
        var rear=videoDevices.some(function(d){
          var lbl=d.label.toLowerCase();
          return lbl.indexOf("back")>=0||lbl.indexOf("rear")>=0||d.label.indexOf("后")>=0;
        });
        var hasLabel=videoDevices.some(function(d){return d.label!==""});
        if(hasLabel){
          hasRearCamera=rear;
          if(!rear&&facingMode==="environment"){
            facingMode="user";
            updateLens();
          }
        }
        return videoDevices.length;
      }catch(e){
        return -1;
      }
    }

    async function requestCamera(mode){
      stopStream();
      facingMode=mode;
      updateLens();
      preview.hidden=true;
      video.hidden=false;
      message.hidden=false;
      message.textContent=(mode==="environment"?"正在启动后置":"正在启动前置")+"摄像头…";
      captureButton.disabled=true;
      retakeButton.hidden=true;
      var baseVideo={width:{ideal:1920},height:{ideal:1080}};
      try{
        // Three-tier fallback: exact facingMode -> ideal facingMode -> no constraint (Mac/desktop)
        try{
          stream=await navigator.mediaDevices.getUserMedia({
            audio:false,video:Object.assign({},baseVideo,{facingMode:{exact:mode}})
          });
        }catch(exactError){
          try{
            stream=await navigator.mediaDevices.getUserMedia({
              audio:false,video:Object.assign({},baseVideo,{facingMode:{ideal:mode}})
            });
          }catch(idealError){
            stream=await navigator.mediaDevices.getUserMedia({
              audio:false,video:baseVideo
            });
          }
        }
        var track=stream.getVideoTracks()[0];
        var actual=(track&&track.getSettings&&track.getSettings().facingMode)||mode;
        if(actual==="user"||actual==="environment")facingMode=actual;
        updateLens();
        video.srcObject=stream;
        await video.play();
        message.hidden=true;
        captureButton.disabled=false;
      }catch(error){
        message.hidden=false;
        var errName=error.name||"";
        if(errName==="NotAllowedError"||errName==="PermissionDeniedError"){
          message.textContent="摄像头权限被拒绝。请在浏览器设置中允许访问摄像头，或使用下方系统相机入口。";
        }else if(errName==="NotFoundError"||errName==="DevicesNotFoundError"){
          message.textContent="未检测到摄像头设备。如使用外接摄像头请检查连接，或使用下方系统相机入口。";
        }else{
          message.textContent="无法启动摄像头："+(error.message||"未知错误")+"。请尝试下方系统相机入口。";
        }
        captureButton.disabled=true;
      }
      Streamlit.height();
    }

    function sendPhoto(dataUrl,source){
      var payload={
        data_url:dataUrl,
        capture_id:(Date.now()+"-"+Math.random().toString(16).slice(2)),
        facing_mode:facingMode,
        source:source
      };
      Streamlit.value(payload);
    }

    function captureVideo(){
      if(!video.videoWidth||!video.videoHeight)return;
      var maxEdge=1920;
      var scale=Math.min(1,maxEdge/Math.max(video.videoWidth,video.videoHeight));
      canvas.width=Math.round(video.videoWidth*scale);
      canvas.height=Math.round(video.videoHeight*scale);
      canvas.getContext("2d").drawImage(video,0,0,canvas.width,canvas.height);
      var dataUrl=canvas.toDataURL("image/jpeg",0.92);
      preview.src=dataUrl;
      preview.hidden=false;
      video.hidden=true;
      message.hidden=true;
      captureButton.disabled=true;
      retakeButton.hidden=false;
      sendPhoto(dataUrl,"live_camera");
      Streamlit.height();
    }

    startButton.addEventListener("click",function(){requestCamera(facingMode)});
    switchButton.addEventListener("click",function(){requestCamera(facingMode==="environment"?"user":"environment")});
    captureButton.addEventListener("click",captureVideo);
    retakeButton.addEventListener("click",function(){
      preview.hidden=true;video.hidden=false;captureButton.disabled=!stream;retakeButton.hidden=true;Streamlit.height();
    });
    nativeCamera.addEventListener("change",function(event){
      var file=event.target.files&&event.target.files[0];
      if(!file)return;
      var reader=new FileReader();
      reader.onload=function(){
        var dataUrl=String(reader.result||"");
        preview.src=dataUrl;preview.hidden=false;video.hidden=true;message.hidden=true;
        captureButton.disabled=true;retakeButton.hidden=false;
        sendPhoto(dataUrl,"native_camera");
        Streamlit.height();
      };
      reader.readAsDataURL(file);
    });

    window.addEventListener("message",async function(event){
      if(!event.data||event.data.type!=="streamlit:render")return;
      var args=event.data.args||{};
      document.getElementById("label").textContent=args.label||"现场拍摄";
      if(!rendered){
        rendered=true;
        facingMode=args.default_facing==="user"?"user":"environment";
        await detectCameras();
        updateLens();
        message.hidden=false;
        if(!hasRearCamera){
          message.textContent="未检测到后置摄像头（Mac/笔记本通常仅配备前置摄像头），已自动切换。点击启动前置摄像头开始取景；首次使用请允许摄像头权限。";
        }else{
          message.textContent="点击启动后置摄像头开始取景；首次使用请允许摄像头权限。";
        }
      }
      Streamlit.height();
    });
    window.addEventListener("beforeunload",stopStream);
    Streamlit.ready();
    Streamlit.height();
  </script>
</body>
</html>
